<!DOCTYPE html>
<html lang="es" class="no-mobile">

<head>
  <!-- Meta Tags -->
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <!-- Favicon Icon -->
  <link rel="icon" href="assets/img/favicon.png">
  <title>Stefachav</title>
  <!-- Plugins Links -->
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/fontawesome.min.css">
  <link rel="stylesheet" href="assets/css/odometer-theme-default.css">
  <link rel="stylesheet" href="assets/css/slick.css">
  <!-- Style Links -->
  <link rel="stylesheet" href="assets/css/style.css">

<!--
  Diseño: plantilla Grace (igual que plantilla-inicio.html).
  Los textos, precios, imágenes y datos de pago NO se editan aquí:
  todo está en assets/js/contenido.js
-->

<body>
  <!-- Start Header Section -->
  <header class="cs_site_header cs_style_1 cs_sticky_header">
    <div class="cs_main_header">
      <div class="container">
        <div class="cs_main_header_in">
          <div class="cs_main_header_left">
            <a class="cs_site_branding" id="m-logo" href="#inicio"></a>
          </div>
          <div class="cs_main_header_right">
            <div class="cs_nav">
              <ul class="cs_nav_list" id="m-menu"></ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>
  <!-- End Header Section -->
  <main>
    <!-- Start Hero Section -->
    <section id="inicio" class="cs_hero cs_style_1">
      <div class="container">
        <div class="cs_hero text-center" id="m-portada"></div>
      </div>
      <div class="cs_imagebox cs_style_1">
        <div class="cs_imagebox_in" id="m-portada-foto"></div>
      </div>
      <div class="cs_hero_bottom cs_focus_bg cs_white_color w-100">
        <div class="container">
          <div class="cs_hero_bottom_wrap d-md-flex justify-content-lg-between align-items-center" id="m-cifras"></div>
        </div>
      </div>
    </section>
    <!-- End Hero Section -->
    <!-- Start About Section -->
    <section id="sobre-mi" class="cs_focus_bg cs_white_color">
      <div class="cs_height_140 cs_height_lg_70"></div>
      <div class="container">
        <div class="cs_about cs_style_1" id="m-sobre-mi"></div>
      </div>
      <div class="cs_height_130 cs_height_lg_70"></div>
    </section>
    <!-- End About Section -->
    <!-- Start Service Section -->
    <section id="servicios">
      <div class="cs_height_135 cs_height_lg_60"></div>
      <div class="container">
        <div class="row">
          <div class="col-lg-4">
            <div>
              <div class="cs_sprin_animation d-inline-block">
                <img src="assets/img/shapes/star_shape_3.svg" alt="">
              </div>
              <div class="cs_height_60"></div>
              <p class="cs_primary_color cs_font_18 cs_opacity_07 mb-0" id="m-servicios-intro"></p>
              <div class="cs_height_lg_20"></div>
            </div>
          </div>
          <div class="col-lg-8">
            <h2 class="cs_font_70 cs_primary_color mb-0 cs_normal" id="m-servicios-titulo"></h2>
            <div class="cs_height_55 cs_height_lg_25"></div>
            <div id="m-servicios"></div>
          </div>
        </div>
      </div>
      <div class="cs_height_150 cs_height_lg_80"></div>
    </section>
    <!-- End Service Section -->
    <!-- Start Price Section (de pricing.html) -->
    <section id="planes">
      <div class="container">
        <div class="cs_hero_text text-center" id="m-planes-titulo"></div>
        <div class="cs_height_80 cs_height_lg_50"></div>
        <div class="row">
          <div class="col-lg-10 offset-lg-1">
            <div class="cs_grid_2 cs_price_wrap" id="m-planes"></div>
          </div>
        </div>
      </div>
      <div class="cs_height_150 cs_height_lg_50"></div>
    </section>
    <!-- End Price Section -->
    <!-- Start Brand Section -->
    <section class="cs_focus_bg cs_white_color">
      <div class="cs_height_135 cs_height_lg_70"></div>
      <div class="container">
        <h2 class="cs_white_color cs_font_70 cs_normal mb-0" id="m-logos-titulo"></h2>
        <div class="cs_height_100 cs_height_lg_50"></div>
      </div>
      <div id="m-logos"></div>
      <div class="cs_height_200 cs_height_lg_50"></div>
    </section>
    <!-- End Brand Section -->
    <!-- Start Portfolio Section (cursos) -->
    <section id="cursos">
      <div class="position-relative">
        <div class="cs_focus_bg cs_white_color cs_height_30"></div>
        <div class="cs_moving_container_wrap cs_style_1 cs_type_1 cs_focus_bg_3 cs_rotate_2 cs_height_100" id="m-cursos-cinta"></div>
        <div class="cs_height_200 cs_height_lg_80"></div>
        <div class="cs_height_50"></div>
      </div>
      <div class="container">
        <div class="cs_project_slider_1">
          <div class="cs_project_slider_in">
            <div class="cs_slider cs_style_1 position-relative">
              <div class="cs_slider_container" data-autoplay="0" data-loop="1" data-speed="800" data-center="0" data-slides-per-view="1">
                <div class="cs_slider_wrapper" id="m-cursos"></div>
                <div class="cs_slick_arrow cs_style_1">
                  <div class="cs_left_arrow cs_btn cs_style_2 cs_focus_1">
                    <svg width="28" height="26" viewBox="0 0 28 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M12.2261 25.6484H13.6457C13.6457 23.1184 12.7071 17.3731 4.87373 13.7213L27.2972 13.6924V12.2488L4.87373 12.2776C12.7071 8.62637 13.6457 2.88044 13.6457 0.351074L12.2261 0.351074C12.2261 2.91477 11.1035 9.21242 0.702637 12.3064V13.6924C11.1035 16.7864 12.2261 23.0841 12.2261 25.6484Z" fill="currentColor" />
                    </svg>
                  </div>
                  <div class="cs_right_arrow cs_btn cs_style_2 cs_focus_1">
                    <svg width="28" height="26" viewBox="0 0 28 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M15.7739 0.351629H14.3543C14.3543 2.88161 15.2929 8.62692 23.1263 12.2787L0.70277 12.3076V13.7512L23.1263 13.7224C15.2929 17.3736 14.3543 23.1196 14.3543 25.6489H15.7739C15.7739 23.0852 16.8965 16.7876 27.2974 13.6936V12.3076C16.8965 9.21359 15.7739 2.91593 15.7739 0.351629Z" fill="currentColor" />
                    </svg>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="cs_height_200 cs_height_lg_65"></div>
    </section>
    <!-- End Portfolio Section -->
    <!-- Start Values Section (especialidades) -->
    <section class="cs_focus_bg cs_white_color">
      <div class="position-relative">
        <div class="cs_moving_container_wrap cs_style_1 cs_type_1 cs_focus_bg_2 cs_rotate_3 cs_height_100" id="m-cinta-2"></div>
        <div class="cs_moving_container_wrap cs_style_1 cs_type_1 cs_focus_bg_3 cs_rotate_2 cs_height_100" id="m-cinta-3"></div>
        <div class="cs_focus_bg cs_white_color cs_height_80"></div>
        <div class="cs_height_200 cs_height_lg_75"></div>
      </div>
      <div class="container">
        <h3 class="cs_section_title cs_white_color cs_font_40 cs_normal mb-0" id="m-expertise-titulo"></h3>
        <div class="cs_height_65 cs_height_lg_30"></div>
        <div class="cs_accordians cs_style_2" id="m-expertise"></div>
      </div>
      <div class="cs_height_150 cs_height_lg_80"></div>
    </section>
    <!-- End Values Section -->
    <!-- Start Client Feetback Section -->
    <section id="testimonios">
      <div class="cs_height_150 cs_height_lg_60"></div>
      <div class="container">
        <div class="row">
          <div class="col-lg-5">
            <div>
              <div class="cs_sprin_animation d-inline-block">
                <img src="assets/img/shapes/star_shape_2.svg" alt="">
              </div>
              <div class="cs_height_100"></div>
              <h2 class="cs_section_title cs_primary_color cs_font_70 mb-0 cs_opacity_05 cs_normal justify-self-end">TESTIMONIOS</h2>
            </div>
          </div>
          <div class="col-lg-7">
            <div class="cs_slider cs_style_1">
              <div class="cs_slider_container" data-autoplay="0" data-loop="1" data-speed="800" data-center="0" data-slides-per-view="1">
                <div class="cs_slider_wrapper" id="m-testimonios"></div>
              </div>
              <div class="cs_slick_arrow cs_style_3">
                <div class="cs_left_arrow cs_btn cs_style_2 cs_focus_1">
                  <svg width="28" height="26" viewBox="0 0 28 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12.2261 25.6484H13.6457C13.6457 23.1184 12.7071 17.3731 4.87373 13.7213L27.2972 13.6924V12.2488L4.87373 12.2776C12.7071 8.62637 13.6457 2.88044 13.6457 0.351074L12.2261 0.351074C12.2261 2.91477 11.1035 9.21242 0.702637 12.3064V13.6924C11.1035 16.7864 12.2261 23.0841 12.2261 25.6484Z" fill="currentColor" />
                  </svg>
                </div>
                <div class="cs_right_arrow cs_btn cs_style_2 cs_focus_1">
                  <svg width="28" height="26" viewBox="0 0 28 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15.7739 0.351629H14.3543C14.3543 2.88161 15.2929 8.62692 23.1263 12.2787L0.70277 12.3076V13.7512L23.1263 13.7224C15.2929 17.3736 14.3543 23.1196 14.3543 25.6489H15.7739C15.7739 23.0852 16.8965 16.7876 27.2974 13.6936V12.3076C16.8965 9.21359 15.7739 2.91593 15.7739 0.351629Z" fill="currentColor" />
                  </svg>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- End Client Feetback Section -->
    <!-- Start Cta Section -->
    <section id="contacto">
      <div class="cs_height_150 cs_height_lg_80"></div>
      <div class="container">
        <div class="cs_cta cs_style_1 text-center cs_focus_bg cs_white_color cs_radius_40">
          <div class="cs_height_100 cs_height_lg_80"></div>
          <div class="cs_cta_info" id="m-cierre"></div>
          <div class="cs_height_115 cs_height_lg_90"></div>
        </div>
      </div>
      <div class="cs_height_140 cs_height_lg_70"></div>
    </section>
    <!-- End Cta Section -->
    <!-- Start Faq Section -->
    <section id="preguntas" class="cs_focus_bg cs_white_color">
      <div class="cs_height_130 cs_height_lg_70"></div>
      <div class="container d-flex justify-content-between align-items-center">
        <div class="cs_sprin_animation">
          <img src="assets/img/shapes/star_shape_1.svg" alt="star-shape">
        </div>
        <h3 class="cs_section_title cs_white_color cs_font_70 cs_normal mb-0">PREGUNTAS</h3>
      </div>
      <div class="cs_height_65 cs_height_lg_30"></div>
      <div class="cs_accordians cs_style_1" id="m-preguntas"></div>
    </section>
    <!-- End Faq Section -->
  </main>
  <!-- Start Footer Section -->
  <footer class="cs_footer cs_style_1 cs_type_1 cs_focus_bg cs_white_color">
    <div class="cs_height_100 cs_height_lg_80"></div>
    <div class="container">
      <div class="row">
        <div class="col-xxl-3 col-lg-3">
          <div class="cs_widget_wrap">
            <div class="cs_site_branding" id="m-logo-footer"></div>
          </div>
        </div>
        <div class="col-lg-9">
          <div class="row">
            <div class="col-xxl-3 col-xl-4 col-lg-6">
              <div class="cs_widget_wrap">
                <h4 class="cs_widget_title cs_white_color text-uppercase cs_normal">links</h4>
                <ul class="cs_footer_links cs_mp_0" id="m-links-footer"></ul>
              </div>
            </div>
            <div class="col-xxl-3 col-xl-4 col-lg-6">
              <div class="cs_widget_wrap">
                <h4 class="cs_widget_title cs_white_color cs_font_25 text-uppercase cs_normal">ubicación</h4>
                <p class="cs_fooer_text cs_font_18 cs_opacity_07 mb-0" id="m-ubicacion"></p>
              </div>
            </div>
            <div class="col-xxl-3 col-xl-4 col-lg-6">
              <div class="cs_widget_wrap">
                <h4 class="cs_widget_title cs_white_color cs_font_25 text-uppercase cs_normal">contacto</h4>
                <ul class="cs_text_list cs_mp_0 cs_opacity_07 mb-0" id="m-contacto-footer"></ul>
              </div>
            </div>
            <div class="col-xxl-3 col-xl-4 col-lg-6">
              <div class="cs_widget_wrap">
                <h4 class="cs_widget_title cs_white_color cs_font_25 text-uppercase cs_normal">sígueme</h4>
                <div class="cs_social cs_style_1" id="m-redes"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="cs_height_60 cs_height_lg_50"></div>
  </footer>
  <!-- End Footer Section -->

  <!-- Ventana de pago con Yape (se abre desde los planes y los cursos) -->
  <div class="m_modal" id="m-pago" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="m_modal_bg" data-cerrar></div>
    <div class="m_modal_box cs_radius_20">
      <button type="button" class="m_modal_close" data-cerrar aria-label="Cerrar">&times;</button>
      <div id="m-pago-body"></div>
    </div>
  </div>

  <!-- Scripts: primero el contenido, luego el armado, luego la plantilla -->
  <script src="assets/js/contenido.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/plugins/jquery-3.6.0.min.js"></script>
  <script src="assets/js/plugins/slick.min.js"></script>
  <script src="assets/js/plugins/odometer.min.js"></script>
  <script src="assets/js/plugins/isotope.pkg.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    // Muestra las cifras de la portada apenas carga la página.
    jQuery(window).on('load', function () { jQuery(window).trigger('scroll'); });
    // En celular, cierra el menú al tocar una opción.
    jQuery(document).on('click', '.cs_nav_list a[href^="#"]', function () {
      if (window.innerWidth < 1200 && jQuery(this).attr('href') !== '#servicios') {
        jQuery('.cs_menu_toggle').removeClass('cs_toggle_active');
        jQuery('.cs_nav_list').slideUp();
      }
    });
  </script>
</body>
</html>
