<!DOCTYPE html>
<html lang="es" class="no-mobile">

<head>
  <!-- Meta Tags -->
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <!-- Favicon Icon -->
  <link rel="icon" href="assets/img/favicon.png">
  <title>Stefachav</title>
  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Plugins Links -->
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/fontawesome.min.css">
  <link rel="stylesheet" href="assets/css/odometer-theme-default.css">
  <!-- Style Links -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/marca.css">
</head>

<!--
  Los textos, precios, imágenes y datos de pago NO se editan aquí:
  todo está en assets/js/contenido.js
-->

<body>
  <!-- Start Header Section -->
  <header class="cs_site_header cs_style_1 cs_sticky_header m_header">
    <div class="cs_main_header">
      <div class="container">
        <div class="cs_main_header_in">
          <div class="cs_main_header_left">
            <a class="cs_site_branding" id="m-logo" href="#inicio"></a>
          </div>
          <div class="cs_main_header_right">
            <div class="cs_nav">
              <ul class="cs_nav_list" id="m-menu"></ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>
  <!-- End Header Section -->

  <main>
    <!-- Portada -->
    <section id="inicio" class="m_hero">
      <div class="container" id="m-portada"></div>
      <div class="container">
        <div class="m_cifras" id="m-cifras"></div>
      </div>
    </section>

    <!-- Logos: trayectoria y clientes -->
    <section class="m_section m_logos" id="m-logos"></section>

    <!-- Sobre mí -->
    <section id="sobre-mi" class="m_section m_dark">
      <div class="container" id="m-sobre-mi"></div>
    </section>

    <!-- Servicios -->
    <section id="servicios" class="m_section">
      <div class="container">
        <div id="m-servicios-head"></div>
        <div class="row g-4 m_cards" id="m-servicios"></div>
      </div>
    </section>

    <!-- Cursos -->
    <section id="cursos" class="m_section m_soft">
      <div class="container">
        <div id="m-cursos-head"></div>
        <div class="row g-4 justify-content-center" id="m-cursos"></div>
        <div class="m_steps_wrap">
          <h3 class="m_steps_title text-center">¿Cómo pagar?</h3>
          <div class="m_steps" id="m-pasos"></div>
        </div>
      </div>
    </section>

    <!-- Testimonios -->
    <section id="testimonios" class="m_section">
      <div class="container">
        <p class="m_kicker text-center">Testimonios</p>
        <h2 class="m_section_title text-center">Lo que dicen</h2>
        <div class="row g-4" id="m-testimonios"></div>
      </div>
    </section>

    <!-- Preguntas frecuentes (acordeón de la plantilla) -->
    <section id="preguntas" class="m_dark m_faq">
      <div class="cs_height_100 cs_height_lg_70"></div>
      <div class="container">
        <h2 class="m_section_title m_white">Preguntas frecuentes</h2>
      </div>
      <div class="cs_height_40 cs_height_lg_30"></div>
      <div class="cs_accordians cs_style_1" id="m-preguntas"></div>
      <div class="cs_height_100 cs_height_lg_70"></div>
    </section>

    <!-- Cierre -->
    <section id="contacto" class="m_section">
      <div class="container">
        <div class="m_cta text-center" id="m-cierre"></div>
      </div>
    </section>
  </main>

  <!-- Start Footer Section -->
  <footer class="cs_footer cs_style_1 cs_type_1 m_dark">
    <div class="cs_height_80 cs_height_lg_60"></div>
    <div class="container">
      <div class="row">
        <div class="col-lg-4">
          <div class="cs_widget_wrap">
            <div class="cs_site_branding m_logo_footer" id="m-logo-footer"></div>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="row">
            <div class="col-md-4">
              <div class="cs_widget_wrap">
                <h4 class="cs_widget_title cs_white_color text-uppercase cs_normal">Servicios</h4>
                <ul class="cs_footer_links cs_mp_0" id="m-links-footer"></ul>
              </div>
            </div>
            <div class="col-md-4">
              <div class="cs_widget_wrap">
                <h4 class="cs_widget_title cs_white_color text-uppercase cs_normal">Contacto</h4>
                <ul class="cs_text_list cs_mp_0 cs_opacity_07 mb-0" id="m-contacto-footer"></ul>
              </div>
            </div>
            <div class="col-md-4">
              <div class="cs_widget_wrap">
                <h4 class="cs_widget_title cs_white_color text-uppercase cs_normal">Sígueme</h4>
                <div class="cs_social cs_style_1" id="m-redes"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <p class="m_copy" id="m-copy"></p>
    </div>
    <div class="cs_height_40"></div>
  </footer>
  <!-- End Footer Section -->

  <!-- Botón flotante de WhatsApp -->
  <a class="m_whatsapp_float" id="m-whatsapp-float" href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
    <i class="fa-brands fa-whatsapp"></i>
  </a>

  <!-- Ventana de pago (Yape) -->
  <div class="m_modal" id="m-pago" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="m_modal_bg" data-cerrar></div>
    <div class="m_modal_box">
      <button type="button" class="m_modal_close" data-cerrar aria-label="Cerrar">&times;</button>
      <div id="m-pago-body"></div>
    </div>
  </div>

  <!-- Scripts: primero el contenido, luego el armado, luego la plantilla -->
  <script src="assets/js/contenido.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/plugins/jquery-3.6.0.min.js"></script>
  <script src="assets/js/plugins/slick.min.js"></script>
  <script src="assets/js/plugins/odometer.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    // Muestra las cifras de la portada apenas carga la página.
    jQuery(window).on('load', function () { jQuery(window).trigger('scroll'); });
    // En celular, cierra el menú al tocar una opción.
    jQuery(document).on('click', '.cs_nav_list a[href^="#"]', function () {
      if (window.innerWidth < 1200 && jQuery(this).attr('href') !== '#servicios') {
        jQuery('.cs_menu_toggle').removeClass('cs_toggle_active');
        jQuery('.cs_nav_list').slideUp();
      }
    });
  </script>
</body>
</html>
